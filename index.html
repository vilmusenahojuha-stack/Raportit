<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#16070b">
  <title>Kuljetuskirjaus</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section id="loginView" class="login-wrap">
      <div class="card login-card">
        <h1>Kuljetuskirjaus</h1>
        <p class="muted">Valitse auto ja anna auton PIN-koodi.</p>
        <label>Auto nro
          <select id="loginAuto">
            <option value="ISS-440">ISS-440</option>
            <option value="GPG-830">GPG-830</option>
          </select>
        </label>
        <label>PIN-koodi
          <input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12">
        </label>
        <button id="loginBtn" class="btn btn-blue btn-big" type="button">Kirjaudu</button>
        <p id="loginStatus" class="message" aria-live="polite"></p>
      </div>
    </section>

    <section id="mainView" class="view hidden">
      <header class="topbar card">
        <div>
          <span class="label">Auto nro</span>
          <strong id="currentAuto" class="top-value">—</strong>
        </div>
        <div class="right">
          <span class="label">Km</span>
          <strong id="currentKm" class="top-value">—</strong>
        </div>
      </header>

      <section class="card entry-card">
        <div class="section-head">
          <h1>Uusi kuorma</h1>
          <span id="nextLoadNo" class="load-badge">Kuorma —</span>
        </div>
        <form id="loadForm" class="entry-grid" novalidate>
          <label>R2 / Asiakas<input id="r2" autocomplete="off"></label>
          <label>Rahtikirja<input id="rahti" autocomplete="off"></label>
          <label>Lastaus pvm<input id="lastausPvm" type="date"></label>
          <label>Lastauspaikka<input id="lastausPaikka" list="lastausList" autocomplete="off"></label>
          <label>Purku pvm<input id="purkuPvm" type="date"></label>
          <label>Purku paikka<input id="purkuPaikka" list="purkuList" autocomplete="off"></label>
          <label>Kuljettaja
            <select id="kuljettaja">
              <option>Juha</option><option>Tommi</option><option>Janne</option>
            </select>
          </label>
          <label>Määrä (m³)<input id="maara" inputmode="decimal"></label>
          <label>Tonnit<input id="tonnit" inputmode="decimal"></label>
          <label>Tuote<input id="tuote" list="tuoteList" autocomplete="off"></label>
          <button id="saveBtn" class="btn btn-green btn-big save-btn" type="submit">Tallenna kuorma</button>
        </form>
        <datalist id="lastausList"></datalist>
        <datalist id="purkuList"></datalist>
        <datalist id="tuoteList"></datalist>
        <p id="saveStatus" class="message" aria-live="polite"></p>
      </section>

      <section class="card recent-card">
        <div class="section-head">
          <h2>8 edellistä kuormaa</h2>
          <button id="refreshBtn" class="btn btn-small" type="button">Päivitä</button>
        </div>
        <div id="recentLoads" class="recent-list"></div>
      </section>

      <div class="bottom-actions">
        <button id="retryBtn" class="btn" type="button">Lähetä odottavat</button>
        <button id="logoutBtn" class="btn btn-ghost" type="button">Vaihda autoa</button>
      </div>
    </section>
  </main>

  <div id="kmModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="kmTitle">
    <div class="modal-sheet card">
      <h2 id="kmTitle">Kuusi kuormaa täynnä</h2>
      <p id="kmPromptText">Anna seuraavien kuuden kuorman aloituskilometrit.</p>
      <label>Uusi km-lukema<input id="nextKmInput" type="number" inputmode="numeric"></label>
      <div class="modal-actions">
        <button id="kmCancelBtn" class="btn btn-ghost" type="button">Peruuta</button>
        <button id="kmSaveBtn" class="btn btn-blue" type="button">Jatka tallennusta</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
